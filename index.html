
<!DOCTYPE html>
<html>
<head>
    <title>NEET The Living World Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
        }

        .quiz-box {
            background: white;
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #222;
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
        }

        button:hover {
            background: #eee;
        }

        #next {
            display: none;
            background: #222;
            color: white;
        }

        #result {
            font-size: 18px;
            font-weight: bold;
        }

        #score {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="quiz-box">

    <h1>NEET: The Living World</h1>

    <p id="question"></p>

    <div id="answers"></div>

    <p id="result"></p>

    <button id="next" onclick="nextQuestion()">Next Question</button>

    <p id="score"></p>

</div>

<script>

const questions = [

    {
        question: "Which statement best describes the relationship between taxonomy and systematics?",
        answers: [
            "Taxonomy deals only with identification, while systematics deals only with naming",
            "Systematics includes taxonomy along with the study of evolutionary relationships",
            "Taxonomy deals only with extinct organisms",
            "Systematics excludes identification and classification"
        ],
        correct: 1
    },

    {
        question: "In binomial nomenclature, the first word of a scientific name represents the:",
        answers: [
            "Species",
            "Family",
            "Genus",
            "Order"
        ],
        correct: 2
    },

    {
        question: "Which rule is correct for writing a scientific name?",
        answers: [
            "Both genus and species begin with capital letters",
            "Genus begins with a capital letter and the specific epithet begins with a small letter",
            "Genus begins with a small letter and species begins with a capital letter",
            "Both words always begin with capital letters"
        ],
        correct: 1
    },

    {
        question: "In the scientific name Mangifera indica, the word 'indica' represents the:",
        answers: [
            "Genus",
            "Family",
            "Specific epithet",
            "Order"
        ],
        correct: 2
    },

    {
        question: "Which sequence represents the correct ascending order of taxonomic categories?",
        answers: [
            "Species → Genus → Family → Order",
            "Genus → Species → Family → Order",
            "Species → Family → Genus → Order",
            "Family → Species → Order → Genus"
        ],
        correct: 0
    },

    {
        question: "Two species belonging to the same genus are expected to:",
        answers: [
            "Always belong to the same species",
            "Share some common characteristics but remain distinct species",
            "Always represent the same variety",
            "Have no taxonomic relationship"
        ],
        correct: 1
    },

    {
        question: "Which taxonomic aid is mainly used for the study and reference of preserved plant specimens?",
        answers: [
            "Herbarium",
            "Zoological park",
            "Museum",
            "Taxonomic key"
        ],
        correct: 0
    },

    {
        question: "Which information is especially useful on a herbarium sheet as a taxonomic record?",
        answers: [
            "Only the colour of the specimen",
            "Only the collector's name",
            "Collection date and locality",
            "Only the common name"
        ],
        correct: 2
    },

    {
        question: "The basic principle used in a taxonomic key is based on:",
        answers: [
            "Habitat only",
            "Contrasting characters",
            "Body size only",
            "Geographical distribution only"
        ],
        correct: 1
    },

    {
        question: "A taxonomic key generally identifies an organism by using:",
        answers: [
            "A series of contrasting statements",
            "Only its geographical location",
            "Only its common name",
            "Only its evolutionary age"
        ],
        correct: 0
    },

    {
        question: "Which pair is correctly matched?",
        answers: [
            "Herbarium — preservation of living animals",
            "Museum — collection of preserved specimens",
            "Key — collection of photographs only",
            "Botanical garden — collection of fossils only"
        ],
        correct: 1
    },

    {
        question: "What is the major difference between a botanical garden and a zoological park?",
        answers: [
            "Botanical gardens maintain living plants, while zoological parks maintain living animals",
            "Both maintain only preserved specimens",
            "Botanical gardens maintain only fossils",
            "Zoological parks maintain only plants"
        ],
        correct: 0
    },

    {
        question: "Which statement most appropriately describes the biological concept of species?",
        answers: [
            "A group of organisms having only the same body size",
            "A group of organisms with fundamental similarities that can generally interbreed to produce fertile offspring",
            "A group of organisms found only in the same habitat",
            "All organisms belonging to the same genus"
        ],
        correct: 1
    },

    {
        question: "If two organisms belong to the same genus but different species, the most appropriate conclusion is that they:",
        answers: [
            "Have no similarities",
            "Share some genus-level characteristics",
            "Are completely identical",
            "Must belong to the same species"
        ],
        correct: 1
    },

    {
        question: "The taxonomic category 'family' is generally positioned:",
        answers: [
            "Above species and below genus",
            "Above genus and below order",
            "Above order and below class",
            "Above kingdom and below class"
        ],
        correct: 1
    },

    {
        question: "Which of the following is NOT a taxonomic category?",
        answers: [
            "Genus",
            "Species",
            "Family",
            "Habitat"
        ],
        correct: 3
    },

    {
        question: "Which statement about a taxon is correct?",
        answers: [
            "A taxon refers only to a species",
            "A taxon can represent a group at any taxonomic rank",
            "A taxon exists only at the kingdom level",
            "A taxon is used only for extinct organisms"
        ],
        correct: 1
    },

    {
        question: "Identification of an organism followed by assigning its scientific name involves:",
        answers: [
            "Identification and nomenclature",
            "Evolution and mutation",
            "Respiration and nutrition",
            "Growth and reproduction"
        ],
        correct: 0
    },

    {
        question: "Which statement about nomenclature is incorrect?",
        answers: [
            "Scientific names facilitate universal communication",
            "Binomial nomenclature generally uses two words",
            "Scientific names are the same as local common names",
            "Scientific naming follows established rules"
        ],
        correct: 2
    },

    {
        question: "The major purpose of taxonomic studies is to:",
        answers: [
            "Memorise only common names",
            "Organise identification, nomenclature and classification of organisms",
            "Study only extinct organisms",
            "Study only the habitats of organisms"
        ],
        correct: 1
    }

];

let currentQuestion = 0;
let score = 0;
let answered = false;

function showQuestion() {

    answered = false;

    document.getElementById("result").innerHTML = "";
    document.getElementById("next").style.display = "none";

    let q = questions[currentQuestion];

    document.getElementById("question").innerHTML =
        "Question " + (currentQuestion + 1) + "/" + questions.length +
        "<br><br>" + q.question;

    let answerBox = document.getElementById("answers");

    answerBox.innerHTML = "";

    q.answers.forEach(function(answer, index) {

        let button = document.createElement("button");

        button.innerHTML = answer;

        button.onclick = function() {
            checkAnswer(index);
        };

        answerBox.appendChild(button);

    });
}

function checkAnswer(selected) {

    if (answered) return;

    answered = true;

    let q = questions[currentQuestion];

    if (selected === q.correct) {

        score++;

        document.getElementById("result").innerHTML =
            "Correct!";

    } else {

        document.getElementById("result").innerHTML =
            "Wrong!";

    }

    document.getElementById("next").style.display = "block";
}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        document.getElementById("question").innerHTML =
            "Quiz Complete!";

        document.getElementById("answers").innerHTML = "";

        document.getElementById("result").innerHTML =
            "Your Score: " + score + "/" + questions.length;

        document.getElementById("next").style.display = "none";
    }
}

showQuestion();

</script>

</body>
    </html>
